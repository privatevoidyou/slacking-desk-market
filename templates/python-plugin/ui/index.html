<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/__sdk__/slacking.css" />
    <script src="/__sdk__/slacking.js"></script>
    <style>
      body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
      .row { display: flex; gap: 8px; }
      .row input { flex: 1; }
      #out { min-height: 72px; white-space: pre-wrap; }
      .error { color: var(--sd-red); }
    </style>
  </head>
  <body>
    <div>
      <h2>Python 示例</h2>
      <div class="sd-muted">界面是网页，逻辑在 Python 里</div>
    </div>
    <div class="row">
      <input id="name" placeholder="你的名字" />
      <button id="greet" class="sd-primary">问候</button>
    </div>
    <button id="notify">让 Python 发一条通知</button>
    <div id="out" class="sd-card sd-muted">点「问候」后，第一次调用会启动 Python 进程。</div>
    <script src="app.js"></script>
  </body>
</html>
